[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lynjax"
version = "0.6.0.dev0"
description = "Lynjax — intelligent network visibility, audit and traceability"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nstalej" }]
keywords = ["network", "audit", "snmp", "ssh", "assessment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.34.0",
    "pydantic~=2.10.0",
    "pydantic-settings~=2.7.0",
    "platformdirs~=4.3.0",
    "aiosqlite~=0.20.0",
    "cryptography~=44.0.0",
    "httpx~=0.28.0",
    "paramiko~=3.5.0",
    "pysnmp~=7.1.0",
    "lxml~=5.3.0",
]

[project.optional-dependencies]
# PDF is optional: the audit still produces Markdown without it, and keeping
# the base install light matters for a tool meant to drop onto any laptop.
pdf = ["reportlab~=4.2"]
dev = [
    "reportlab~=4.2",
    "pytest~=8.3.0",
    "pytest-asyncio~=0.24.0",
    "pytest-cov~=6.0.0",
    "ruff~=0.8.0",
]

[project.scripts]
lynjax = "lynjax.cli:main"

[project.urls]
Homepage = "https://github.com/Nstalej/lynjax"
Repository = "https://github.com/Nstalej/lynjax"

[tool.setuptools.packages.find]
include = ["lynjax*"]

# The compiled frontend ships inside the package, so `pipx install lynjax`
# brings the UI with it and no separate web server is needed.
[tool.setuptools.package-data]
lynjax = ["web/**/*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]
