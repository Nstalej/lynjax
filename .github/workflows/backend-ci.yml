name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  backend-checks:
    name: Python / FastAPI baseline
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dev pulls in requirements plus pytest, pytest-asyncio
          # and ruff. Installing bare pytest here would skip pytest-asyncio and
          # every async test would error at collection.
          python -m pip install -r backend/requirements-dev.txt

      - name: Lint
        run: ruff check backend

      - name: Compile
        run: python -m compileall -q backend/app backend/tests

      - name: Run backend tests
        # Run from backend/ so pytest.ini applies; it sets asyncio_mode=auto,
        # without which the async tests are collected but never awaited.
        working-directory: backend
        run: pytest -v
