name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  backend-checks:
    name: Python / FastAPI baseline
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the package itself, so CI exercises the same entry points a
          # user gets from `pipx install lynjax` rather than a loose source tree.
          python -m pip install -e './backend[dev]'

      - name: Lint
        run: ruff check backend

      - name: Compile
        run: python -m compileall -q backend/lynjax backend/tests

      - name: Verify the CLI entry point is installed
        run: lynjax --version

      - name: Run backend tests
        # Run from backend/ so pytest.ini applies; it sets asyncio_mode=auto,
        # without which the async tests are collected but never awaited.
        working-directory: backend
        run: pytest -v
