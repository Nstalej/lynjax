name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  backend-checks:
    name: Python / FastAPI baseline
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies when available
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff
          if [ -f backend/requirements.txt ]; then
            python -m pip install -r backend/requirements.txt
          elif [ -f backend/pyproject.toml ]; then
            python -m pip install -e backend || python -m pip install -e 'backend[dev]'
          else
            echo "No backend/requirements.txt or backend/pyproject.toml yet; running structural checks only."
          fi

      - name: Lint Python files when present
        run: |
          if find backend -name '*.py' -print -quit | grep -q .; then
            ruff check backend
          else
            echo "No Python files in backend yet; lint skipped."
          fi

      - name: Compile Python files when present
        run: |
          if find backend -name '*.py' -print -quit | grep -q .; then
            python -m compileall backend
          else
            echo "No Python files in backend yet; compile skipped."
          fi

      - name: Run backend tests when present
        run: |
          if find backend/tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            pytest backend/tests -v
          else
            echo "No backend tests yet; pytest skipped."
          fi
