name: Docker CI

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker-ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t lynjax:ci .

      - name: Start the container
        run: |
          docker run -d --name lynjax-ci -p 8080:8080 lynjax:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "Container is healthy after ${attempt}s."
              exit 0
            fi
            sleep 1
          done
          echo "The container never became healthy. Logs:"
          docker logs lynjax-ci
          exit 1

      - name: Verify the API answers
        run: |
          curl -fsS http://localhost:8080/api/v1/info | tee /dev/stderr | grep -q '"name":"Lynjax"'

      - name: Verify the UI is served from the same port
        # The single-container decision only holds if the bundle really ships
        # inside the package; this is the check that proves it.
        run: |
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'

      - name: Verify real network access is off by default
        # A container that scanned networks out of the box would be a liability.
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:8080/api/v1/audit \
            -H 'Content-Type: application/json' -d '{}')
          echo "POST /api/v1/audit -> $status"
          test "$status" = "403"

      - name: Container logs on failure
        if: failure()
        run: docker logs lynjax-ci

      - name: Stop the container
        if: always()
        run: docker rm -f lynjax-ci || true
