<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lynjax Demo Target</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #0f172a;
        background: linear-gradient(135deg, #f2faf8 0%, #dff6f2 100%);
      }
      main {
        max-width: 720px;
        padding: 40px;
        border: 1px solid #b7cdd1;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 24px 80px rgba(8, 59, 92, 0.12);
      }
      .eyebrow { color: #0e7490; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      h1 { color: #083b5c; font-size: clamp(2rem, 5vw, 4rem); margin: 12px 0; }
      code { background: #e8f7f5; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Lynjax Local Lab</div>
      <h1>Demo Web Target</h1>
      <p>This static service is safe to probe from Lynjax during local beta development.</p>
      <p>Expected check: <code>HTTP 200</code> on <code>/</code>.</p>
    </main>
  </body>
</html>
